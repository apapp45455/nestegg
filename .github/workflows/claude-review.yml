name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # PRs from forks can't access secrets (a security measure for public repos), and draft PRs aren't reviewed yet
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            請用繁體中文審查這個 PR。PR 的分支已經 checkout 在目前目錄。專案說明見 README.md。

            依序檢查：
            1. 正確性：帳本 CSV 解析與合併、寵物引擎的數值規則、日期與時區、邊界情況
            2. 資料安全：寫入帳本與設定檔不能有寫到一半被清空的可能；富邦金鑰只能加密後存放
            3. 券商唯讀：不可以新增任何下單、改單、刪單相關的 SDK 呼叫（只允許登入、查詢、登出）
            4. 隱私：使用者的帳本與持股不可以送出這台電腦（富邦同步與下載公開行情整張表除外）
            5. 相容性：macOS 與 Windows 都要能跑（路徑、換行、權限、視窗行為）
            6. 測試：新的邏輯有沒有對應的單元或端到端測試

            只針對真正的問題留言，不要稱讚、不要重複描述程式做了什麼。
            用 `mcp__github_inline_comment__create_inline_comment`（confirmed: true）標出具體的程式問題；
            用 `gh pr comment` 留一則總結（沒有問題就簡短說明檢查了哪些面向）。
            只透過 GitHub 留言回覆，不要把審查內容當成一般訊息輸出。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
