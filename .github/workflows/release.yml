name: Release

# 推一個 v 開頭的 tag（例如 git tag v0.2.0 && git push origin v0.2.0）就會打包 macOS 與 Windows 安裝檔並發布
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: 打包（${{ matrix.os }}）
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:e2e
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    name: 發布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: 建立 Release 並上傳安裝檔
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "NestEgg $GITHUB_REF_NAME" --generate-notes
